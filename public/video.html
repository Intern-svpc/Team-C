<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: #6b7280;
            --secondary-hover: #4b5563;
            --text-color: #1f2937;
            --text-secondary: #4b5563;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --video-bg: #000000;
            --card-radius: 8px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #6b7280;
            --secondary-hover: #9ca3af;
            --text-color: #f9fafb;
            --text-secondary: #d1d5db;
            --bg-color: #111827;
            --card-bg: #1f2937;
            --border-color: #374151;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            --video-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
            transition: var(--transition);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle-btn {
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            font-size: 1.25rem;
            padding: 0.5rem;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: var(--transition);
        }

        .video-container {
            width: 100%;
            background-color: var(--card-bg);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: var(--video-bg);
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: var(--card-radius);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }

        .video-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-color);
            text-align: left;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .back-btn {
            background-color: var(--secondary-color);
        }

        .back-btn:hover {
            background-color: var(--secondary-hover);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1.25rem;
            border-radius: var(--card-radius);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .video-container {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
                gap: 1rem;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Video Player</h1>
            <div class="theme-toggle">
                <button id="themeToggle" class="theme-toggle-btn" title="Toggle dark/light mode">
                    🌙
                </button>
            </div>
        </div>

        <div class="video-container">
            <h2 id="videoTitle" class="video-title">Loading video...</h2>
            <div class="video-wrapper">
                <video id="videoPlayer" controls>
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div id="loadingIndicator" class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn back-btn" onclick="goBack()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Go Back
                </button>
                <button id="downloadBtn" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    Download Video
                </button>
            </div>
        </div>
    </div>

    <script>
        // Theme toggling functionality
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        
        // Check for saved theme preference or default to 'light'
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
        
        function updateThemeIcon(theme) {
            themeToggle.innerHTML = theme === 'light' ? '🌙' : '☀️';
        }

        function goBack() {
            window.history.back();
        }

        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        const videoTitle = document.getElementById('videoTitle');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('videoId');
        const title = urlParams.get('title') || 'Video Playback';
        
        videoTitle.textContent = title;

        if (videoId) {
            const videoUrl = '/video/' + videoId;
            videoSource.src = videoUrl;
            
            // Set up download button
            downloadBtn.addEventListener('click', () => {
                const link = document.createElement('a');
                link.href = videoUrl;
                link.download = title + '.mp4';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            
            // Show loading indicator until video is loaded
            videoPlayer.addEventListener('loadeddata', () => {
                loadingIndicator.style.display = 'none';
            });
            
            videoPlayer.addEventListener('error', () => {
                loadingIndicator.innerHTML = '<p>Error loading video. Please try again.</p>';
            });
            
            videoPlayer.load();
        } else {
            loadingIndicator.innerHTML = '<p>Video ID not provided.</p>';
            downloadBtn.disabled = true;
            downloadBtn.style.opacity = '0.6';
            downloadBtn.style.cursor = 'not-allowed';
        }
    </script>
</body>
</html>
