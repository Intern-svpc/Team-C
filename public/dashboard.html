<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard</title>
    <style>
        :root {
    /* Light theme variables */
    --bg-primary: #f3f4f6;
    --bg-secondary: #ffffff;
    --text-primary: #1a1a1a;
    --text-secondary: #4b5563;
    --border-color: #e5e7eb;
    --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    --highlight-color: #2563eb;
    --highlight-hover: #1d4ed8;
    --danger-color: #dc2626;
    --danger-hover: #b91c1c;
    --warning-color: #f59e0b;
    --warning-hover: #d97706;
    --success-color: #059669;
    --success-hover: #047857;
    --input-bg: #ffffff;
    --input-border: #d1d5db;
}

[data-theme="dark"] {
    /* Dark theme variables */
    --bg-primary: #121212;
    --bg-secondary: #1e1e1e;
    --text-primary: #e5e7eb;
    --text-secondary: #9ca3af;
    --border-color: #374151;
    --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    --highlight-color: #3b82f6;
    --highlight-hover: #2563eb;
    --danger-color: #ef4444;
    --danger-hover: #dc2626;
    --warning-color: #f59e0b;
    --warning-hover: #d97706;
    --success-color: #10b981;
    --success-hover: #059669;
    --input-bg: #2d3748;
    --input-border: #4b5563;
}

body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    margin: 0;
    padding: 0;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 1rem;
}

.welcome-text {
    color: var(--text-primary);
    font-weight: 600;
}

.theme-logout-container {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.theme-toggle {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-primary);
    padding: 0.25rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logout-btn {
    background-color: var(--danger-color);
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background-color 0.3s ease;
}

.logout-btn:hover {
    background-color: var(--danger-hover);
}

.create-session-btn {
    background-color: var(--highlight-color);
    color: white;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    margin-bottom: 2rem;
    font-weight: 500;
    transition: background-color 0.3s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.create-session-btn:hover {
    background-color: var(--highlight-hover);
    transform: translateY(-2px);
}

.create-session-btn:active {
    transform: translateY(0);
}

.sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
}

.session-card {
    background-color: var(--bg-secondary);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: var(--card-shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid var(--border-color);
}

.session-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
}

.session-title {
    color: var(--text-primary);
    font-size: 1.25rem;
    margin-bottom: 1rem;
    font-weight: 600;
}

.session-info {
    color: var(--text-secondary);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.video-list {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
}

.video-item {
    padding: 0.75rem;
    background-color: var(--bg-primary);
    border-radius: 8px;
    margin-bottom: 0.75rem;
    border: 1px solid var(--border-color);
    transition: transform 0.2s ease;
}

.video-item:hover {
    transform: translateX(3px);
}

.video-title {
    margin: 0 0 0.75rem 0;
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-primary);
}

.video-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.video-item button {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

.video-item button:hover {
    transform: translateY(-2px);
}

.video-item button:active {
    transform: translateY(0);
}

.view-btn {
    background-color: var(--highlight-color);
    color: white;
}

.view-btn:hover {
    background-color: var(--highlight-hover);
}

.replace-btn {
    background-color: var(--warning-color);
    color: white;
}

.replace-btn:hover {
    background-color: var(--warning-hover);
}

.delete-btn {
    background-color: var(--danger-color);
    color: white;
}

.delete-btn:hover {
    background-color: var(--danger-hover);
}

.add-video-btn {
    background-color: var(--success-color);
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 1rem;
    font-weight: 500;
    transition: background-color 0.3s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
}

.add-video-btn:hover {
    background-color: var(--success-hover);
    transform: translateY(-2px);
}

.add-video-btn:active {
    transform: translateY(0);
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    z-index: 1000;
    backdrop-filter: blur(3px);
}

.modal-content {
    position: relative;
    background-color: var(--bg-secondary);
    margin: 10% auto;
    padding: 2rem;
    border-radius: 12px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
}

.close-modal {
    position: absolute;
    right: 1rem;
    top: 1rem;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-secondary);
    transition: color 0.3s ease;
}

.close-modal:hover {
    color: var(--text-primary);
}

.modal-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.modal-form label {
    color: var(--text-primary);
    font-weight: 500;
}

.modal-form input {
    padding: 0.75rem;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background-color: var(--input-bg);
    color: var(--text-primary);
    transition: border-color 0.3s ease;
}

.modal-form input:focus {
    outline: none;
    border-color: var(--highlight-color);
}

.modal-form button {
    background-color: var(--highlight-color);
    color: white;
    padding: 0.75rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background-color 0.3s ease;
}

.modal-form button:hover {
    background-color: var(--highlight-hover);
}

#uploadStatus {
    margin-top: 1rem;
    text-align: center;
    color: var(--text-primary);
}

.loading {
    text-align: center;
    padding: 2rem;
    color: var(--text-secondary);
}

.error {
    color: var(--danger-color);
    text-align: center;
    padding: 1rem;
    margin: 1rem 0;
    background-color: rgba(220, 38, 38, 0.1);
    border-radius: 8px;
    border: 1px solid var(--danger-color);
}

.no-sessions {
    text-align: center;
    padding: 2rem;
    background-color: var(--bg-secondary);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    border: 1px solid var(--border-color);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.delete-course-btn {
    background-color: var(--danger-color);
    color: white;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    transition: background-color 0.3s ease;
}

.delete-course-btn:hover {
    background-color: var(--danger-hover);
}

.confirm-dialog {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1100;
    backdrop-filter: blur(3px);
}

.confirm-content {
    background-color: var(--bg-secondary);
    padding: 2rem;
    border-radius: 12px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
}

.confirm-message {
    margin-bottom: 1.5rem;
    color: var(--text-primary);
}

.confirm-warning {
    color: var(--danger-color);
    font-weight: 500;
    margin-bottom: 1.5rem;
}

.confirm-buttons {
    display: flex;
    justify-content: center;
    gap: 1rem;
}

.confirm-btn {
    padding: 0.5rem 1.5rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

.confirm-btn.delete {
    background-color: var(--danger-color);
    color: white;
}

.confirm-btn.delete:hover {
    background-color: var(--danger-hover);
    transform: translateY(-2px);
}

.confirm-btn.cancel {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
}

.confirm-btn.cancel:hover {
    background-color: var(--bg-primary);
    transform: translateY(-2px);
}

@media (max-width: 640px) {
    .sessions-grid {
        grid-template-columns: 1fr;
    }
    
    .header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
    }
    
    .theme-logout-container {
        width: 100%;
        justify-content: space-between;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="welcome-text">Welcome, <span id="mentorName"></span></h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <button class="create-session-btn" onclick="window.location.href='/mentor.html'">Create New Session</button>
        
        <div id="errorContainer"></div>
        <div id="loadingContainer"></div>
        <div id="sessionsContainer" class="sessions-grid"></div>
    </div>

    <div id="addVideoModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Add New Video</h2>
            <form id="addVideoForm" class="modal-form">
                <input type="hidden" id="modalSessionId">
                <label for="sessionTitle">Session Title:</label>
                <input type="text" id="sessionTitle" required>
                <label for="videoFile">Video File:</label>
                <input type="file" id="videoFile" accept="video/*" required>
                <button type="submit">Upload Video</button>
            </form>
            <div id="uploadStatus"></div>
        </div>
    </div>

    <script>
        // Utility functions
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        function setLoading(isLoading) {
            const loadingContainer = document.getElementById('loadingContainer');
            loadingContainer.innerHTML = isLoading ? '<div class="loading">Loading...</div>' : '';
        }

        // Token validation
        const token = localStorage.getItem('mentorToken');
        if (!token) {
            window.location.href = '/login.html';
        }

        async function fetchMentorData() {
            try {
                setLoading(true);
                const response = await fetch('/auth/mentor-data', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to fetch mentor data');

                const data = await response.json();
                document.getElementById('mentorName').textContent = data.name;
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load mentor data');
                logout();
            } finally {
                setLoading(false);
            }
        }

        async function fetchSessions() {
            try {
                setLoading(true);
                const response = await fetch('/mentor/courses', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to fetch sessions');

                const sessions = await response.json();
                
                // Update the sessions count to match the number of videos
                sessions.forEach(session => {
                    // Set sessions count to the number of videos
                    session.sessions = session.videos ? session.videos.length : 0;
                });
                
                displaySessions(sessions);
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load sessions');
            } finally {
                setLoading(false);
            }
        }

        function showDeleteConfirmDialog(message, warningMessage, onConfirm) {
            const dialog = document.createElement('div');
            dialog.className = 'confirm-dialog';
            dialog.innerHTML = `
                <div class="confirm-content">
                    <p class="confirm-message">${message}</p>
                    <p class="confirm-warning">${warningMessage}</p>
                    <div class="confirm-buttons">
                        <button class="confirm-btn delete" onclick="handleConfirm(true)">Delete</button>
                        <button class="confirm-btn cancel" onclick="handleConfirm(false)">Cancel</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(dialog);
            
            window.handleConfirm = function(confirmed) {
                if (confirmed) {
                    onConfirm();
                }
                dialog.remove();
                delete window.handleConfirm;
            };
        }

        async function deleteCourse(courseId, courseName) {
            showDeleteConfirmDialog(
                `Are you sure you want to delete the course "${courseName}"?`,
                "This action cannot be undone and will delete all videos associated with this course.",
                async () => {
                    try {
                        setLoading(true);
                        const response = await fetch(`/delete-course/${courseId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        });

                        const result = await response.json();
                        
                        if (response.ok) {
                            showError(`Course "${courseName}" has been successfully deleted`);
                            fetchSessions(); // Refresh the sessions list
                        } else {
                            throw new Error(result.message || 'Failed to delete course');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        showError(error.message || 'Failed to delete course. Please try again.');
                    } finally {
                        setLoading(false);
                    }
                }
            );
        }

        function displaySessions(sessions) {
            const container = document.getElementById('sessionsContainer');

            if (sessions.length === 0) {
                container.innerHTML = `<div class="no-sessions"><h2>No Sessions Yet</h2><p>Create your first session to get started!</p></div>`;
                return;
            }

            // Create an array of HTML strings and then join them together
            const sessionCards = sessions.map(session => {
                // Calculate number of videos - ensure it's never negative
                const videosCount = session.videos && session.videos.length ? session.videos.length : 0;
                
                return `
                <div class="session-card">
                    <div class="card-header">
                        <h2 class="session-title">${session.subjectName}</h2>
                        <button class="delete-course-btn" onclick="deleteCourse('${session._id}', '${session.subjectName}')">
                            Delete Course
                        </button>
                    </div>
                    <div class="session-info">Author: ${session.authorName}</div>
                    <div class="session-info">Number of Sessions: ${videosCount}</div>

                    <div class="video-list">
                        <h3>Videos</h3>
                        ${videosCount > 0 ? session.videos.map(video => `
                            <div class="video-item">
                                <h4 class="video-title">${video.sessionTitle}</h4>
                                <div class="video-actions">
                                    <button class="view-btn" onclick="openVideoPage('${video.videoId}')">View Video</button>
                                    <button class="replace-btn" onclick="replaceVideo('${session._id}', '${video.videoId}')">Replace</button>
                                    <button class="delete-btn" onclick="deleteVideo('${session._id}', '${video.videoId}')">Delete</button>
                                </div>
                            </div>
                        `).join('') : '<p>No videos yet.</p>'}
                        <button class="add-video-btn" onclick="showAddVideoModal('${session._id}')">Add New Video</button>
                    </div>
                </div>
            `;
            });
            
            // Join all session cards into a single HTML string
            container.innerHTML = sessionCards.join('');
        }

        function openVideoPage(videoId) {
            window.location.href = `/video.html?videoId=${videoId}`;
        }

        function logout() {
            localStorage.removeItem('mentorToken');
            window.location.href = '/login.html';
        }

        async function deleteVideo(sessionId, videoId) {
            if (!confirm("Are you sure you want to delete this video?")) return;

            try {
                const response = await fetch(`/delete-video/${sessionId}/${videoId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message || 'Video deleted successfully!');
                    fetchSessions(); // This will refresh and update the session count
                } else {
                    throw new Error(result.message || 'Failed to delete video');
                }
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            }
        }

        async function replaceVideo(sessionId, videoId) {
            const newVideoFile = document.createElement('input');
            newVideoFile.type = 'file';
            newVideoFile.accept = 'video/*';

            newVideoFile.addEventListener('change', async () => {
                const file = newVideoFile.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('sessionId', sessionId);
                formData.append('videoId', videoId);
                formData.append('newVideo', file);

                try {
                    const response = await fetch('/replace-video', {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    const result = await response.json();
                    if (response.ok) {
                        alert(result.message || 'Video replaced successfully!');
                        fetchSessions(); // Refresh session data
                    } else {
                        throw new Error(result.message || 'Failed to replace video');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showError(error.message);
                }
            });

            newVideoFile.click();
        }

        function showAddVideoModal(sessionId) {
            document.getElementById('modalSessionId').value = sessionId;
            document.getElementById('addVideoModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('addVideoModal').style.display = 'none';
            document.getElementById('addVideoForm').reset();
            document.getElementById('uploadStatus').textContent = '';
        }

        document.getElementById('addVideoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sessionId = document.getElementById('modalSessionId').value;
            const sessionTitle = document.getElementById('sessionTitle').value;
            const videoFile = document.getElementById('videoFile').files[0];
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            const formData = new FormData();
            formData.append('sessionId', sessionId);
            formData.append('sessionTitles', sessionTitle);
            formData.append('sessionVideos', videoFile);

            try {
                statusDiv.textContent = 'Uploading...';
                
                const response = await fetch('/upload-videos', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.textContent = 'Upload successful!';
                    setTimeout(() => {
                        closeModal();
                        fetchSessions(); // This will refresh the session count
                    }, 1500);
                } else {
                    throw new Error(result.message || 'Upload failed');
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.textContent = error.message || 'Upload failed. Please try again.';
            }
        });

        // Add this to your existing <script> section
function initTheme() {
    // Check for saved theme preference or use system preference
    const savedTheme = localStorage.getItem('theme') || 
                      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    
    // Apply the theme
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    // Update the theme toggle button icon
    updateThemeIcon(savedTheme);
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    // Save preference
    localStorage.setItem('theme', newTheme);
    
    // Apply the theme
    document.documentElement.setAttribute('data-theme', newTheme);
    
    // Update the theme toggle button icon
    updateThemeIcon(newTheme);
}

function updateThemeIcon(theme) {
    const themeToggleBtn = document.getElementById('themeToggle');
    if (themeToggleBtn) {
        themeToggleBtn.innerHTML = theme === 'dark' 
            ? '☀️' // Sun for dark mode (to switch to light)
            : '🌙'; // Moon for light mode (to switch to dark)
    }
}

// Add this to your existing initialization code
function enhanceUI() {
    // Add theme toggle button to header
    const header = document.querySelector('.header');
    if (header) {
        // Create theme-logout container
        const themeLogoutContainer = document.createElement('div');
        themeLogoutContainer.className = 'theme-logout-container';
        
        // Get the existing logout button
        const logoutBtn = header.querySelector('.logout-btn');
        
        // Create theme toggle button
        const themeBtn = document.createElement('button');
        themeBtn.id = 'themeToggle';
        themeBtn.className = 'theme-toggle';
        themeBtn.setAttribute('aria-label', 'Toggle dark/light mode');
        themeBtn.onclick = toggleTheme;
        
        // Add buttons to container
        themeLogoutContainer.appendChild(themeBtn);
        if (logoutBtn) {
            // Move logout button to container
            header.removeChild(logoutBtn);
            themeLogoutContainer.appendChild(logoutBtn);
        }
        
        // Add container to header
        header.appendChild(themeLogoutContainer);
        
        // Add icons to buttons
        const addVideoButtons = document.querySelectorAll('.add-video-btn');
        addVideoButtons.forEach(btn => {
            btn.innerHTML = '➕ Add New Video';
        });
        
        const createSessionButton = document.querySelector('.create-session-btn');
        if (createSessionButton) {
            createSessionButton.innerHTML = '📝 Create New Session';
        }
    }
    
    // Initialize theme
    initTheme();
}

// Add this to your existing initialization code
window.addEventListener('DOMContentLoaded', function() {
    fetchMentorData();
    fetchSessions();
    enhanceUI();
});

    </script>
</body>
</html>
