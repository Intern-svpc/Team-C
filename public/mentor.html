<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Session Creation Form</title>
    <style>
      :root {
        --primary-color: #3b82f6;
        --primary-hover: #2563eb;
        --secondary-color: #6b7280;
        --secondary-hover: #4b5563;
        --success-color: #059669;
        --error-color: #dc2626;
        --text-color: #1f2937;
        --text-secondary: #4b5563;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --input-bg: #ffffff;
        --border-color: #d1d5db;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
        --card-radius: 8px;
        --transition: all 0.3s ease;
      }

      [data-theme="dark"] {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --secondary-color: #6b7280;
        --secondary-hover: #9ca3af;
        --success-color: #10b981;
        --error-color: #ef4444;
        --text-color: #f9fafb;
        --text-secondary: #d1d5db;
        --bg-color: #111827;
        --card-bg: #1f2937;
        --input-bg: #374151;
        --border-color: #374151;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
        transition: var(--transition);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }

      .container {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: var(--card-radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 500px;
        transition: var(--transition);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      h1 {
        color: var(--text-color);
        font-weight: 700;
        font-size: 1.5rem;
      }

      .theme-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .theme-toggle-btn {
        border: none;
        background: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-color);
        font-size: 1.25rem;
        padding: 0.5rem;
        border-radius: 50%;
        background-color: var(--border-color);
        transition: var(--transition);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      label {
        font-weight: 600;
        color: var(--text-color);
        font-size: 0.875rem;
      }

      input, select {
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 1rem;
        background-color: var(--input-bg);
        color: var(--text-color);
        transition: var(--transition);
        width: 100%;
      }

      input:focus, select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      input:disabled {
        background-color: var(--bg-color);
        opacity: 0.7;
        cursor: not-allowed;
      }

      button {
        background-color: var(--primary-color);
        color: white;
        padding: 0.75rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: var(--transition);
      }

      button:hover:not(:disabled) {
        background-color: var(--primary-hover);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 1.5rem;
        gap: 1rem;
      }

      .back-button {
        background-color: var(--secondary-color);
        flex: 1;
      }

      .back-button:hover {
        background-color: var(--secondary-hover);
      }

      .submit-button {
        flex: 1;
      }

      .error-message {
        color: var(--error-color);
        text-align: center;
        margin-top: 0.75rem;
        font-size: 0.875rem;
        transition: var(--transition);
      }

      @media (max-width: 640px) {
        .container {
          padding: 1.5rem;
        }
        
        .nav-buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Session Creation Form</h1>
        <div class="theme-toggle">
          <button id="themeToggle" class="theme-toggle-btn" title="Toggle dark/light mode">
            🌙
          </button>
        </div>
      </div>

      <form id="sessionForm">
        <div class="form-group">
          <label for="authorName">Author Name</label>
          <input type="text" id="authorName" name="authorName" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="subjectName">Subject Name</label>
          <input type="text" id="subjectName" name="subjectName" placeholder="Enter the subject of your session" required>
        </div>

        <div class="form-group">
          <label for="sessions">Number of Sessions</label>
          <input type="number" id="sessions" name="sessions" placeholder="Enter number of sessions" required min="1">
        </div>

        <div class="form-group">
          <label for="sessionType">Session Type</label>
          <select id="sessionType" name="sessionType" required>
            <option value="">Select session type</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="form-group">
          <label for="price">Price (only for paid sessions)</label>
          <input type="number" id="price" name="price" placeholder="Enter price" disabled step="0.01">
        </div>

        <div class="nav-buttons">
          <button type="button" class="back-button" onclick="window.location.href='/dashboard.html'">Back to Dashboard</button>
          <button type="submit" class="submit-button">Create Session</button>
        </div>
      </form>
      <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
      // Theme toggling functionality
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      
      // Check for saved theme preference or default to 'light'
      const savedTheme = localStorage.getItem('theme') || 'light';
      htmlElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
      
      themeToggle.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      });
      
      function updateThemeIcon(theme) {
        themeToggle.innerHTML = theme === 'light' ? '🌙' : '☀️';
      }

      // Check authentication when page loads
      const token = localStorage.getItem('mentorToken');
      if (!token) {
        window.location.href = '/login.html';
      }

      document.getElementById('sessionType').addEventListener('change', function() {
        const priceInput = document.getElementById('price');
        if (this.value === 'paid') {
          priceInput.disabled = false;
          priceInput.required = true;
        } else {
          priceInput.disabled = true;
          priceInput.required = false;
          priceInput.value = '';
        }
      });

      // Form submission handler
      document.getElementById('sessionForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        const submitButton = document.querySelector('.submit-button');
        
        // Disable submit button while processing
        submitButton.disabled = true;
        submitButton.textContent = 'Creating Session...';
        
        const token = localStorage.getItem('mentorToken');
        if (!token) {
          errorDiv.textContent = 'Authentication token not found. Please login again.';
          window.location.href = '/login.html';
          return;
        }

        const formData = new FormData(this);
        const formObj = {};
        formData.forEach((value, key) => {
          if (key !== 'price' || !document.getElementById('price').disabled) {
            formObj[key] = value;
          }
        });

        try {
          // First create the session
          const response = await fetch('/submit-form', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(formObj)
          });
          
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Failed to create session');
          }

          if (result.sessionId) {
            // Get session data from the upload-video endpoint
            const uploadResponse = await fetch(`/upload-video/${result.sessionId}`, {
              headers: {
                'Authorization': `Bearer ${token}`
              }
            });

            if (!uploadResponse.ok) {
              throw new Error('Failed to get upload session data');
            }

            const uploadData = await uploadResponse.json();
            
            // Navigate directly to upload.html with the session data
            window.location.href = `/upload.html?sessionId=${uploadData.sessionId}&sessions=${uploadData.sessions}`;
          }
        } catch (error) {
          console.error('Error:', error);
          errorDiv.textContent = error.message || 'An error occurred while creating the session';
          
          // Re-enable submit button
          submitButton.disabled = false;
          submitButton.textContent = 'Create Session';
        }
      });
    </script>
  </body>
</html>
