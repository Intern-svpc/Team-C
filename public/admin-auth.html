<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind dark mode configuration
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            primary: '#0f172a',
                            secondary: '#1e293b',
                            accent: '#3b82f6'
                        }
                    },
                    boxShadow: {
                        'custom': '0 4px 20px 0 rgba(0, 0, 0, 0.3)'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: linear-gradient(to bottom right, #0f172a, #1e293b);
            background-attachment: fixed;
        }
        input {
            background-color: rgba(30, 41, 59, 0.8);
            color: #f9fafb;
            border-color: #475569;
            transition: all 0.2s ease;
        }
        input:focus {
            background-color: rgba(30, 41, 59, 1);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
        input::placeholder {
            color: #94a3b8;
        }
        .form-container {
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .glow-effect {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>
    <div class="form-container container max-w-md mx-auto p-8 bg-slate-800/90 rounded-xl shadow-custom backdrop-blur">
        <div class="mb-8 flex justify-center">
            <!-- Professional logo/icon -->
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-500 mb-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                <h1 class="text-2xl font-bold tracking-tight text-white">Admin Portal</h1>
                <p class="text-gray-400 text-sm mt-1">Secure authentication system</p>
            </div>
        </div>
        
        <!-- Tab Navigation -->
        <div class="flex justify-center border-b border-slate-700 mb-6">
            <button id="loginTab" class="py-3 px-6 font-medium text-blue-400 border-b-2 border-blue-500 transition-colors">Login</button>
            <button id="signupTab" class="py-3 px-6 font-medium text-gray-400 hover:text-gray-300 transition-colors">Sign Up</button>
        </div>
        
        <div id="alertBox" class="hidden mb-6 p-4 rounded-lg"></div>
        
        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label for="loginEmail" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                <input type="email" id="loginEmail" name="email" required 
                    class="block w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-700/80 text-white">
            </div>
            
            <div>
                <label for="loginPassword" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="loginPassword" name="password" required 
                    class="block w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-700/80 text-white">
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-600 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-300">
                        Remember me
                    </label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-400 hover:text-blue-300 transition-colors">
                        Forgot password?
                    </a>
                </div>
            </div>
            
            <div class="pt-2">
                <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all glow-effect">
                    Sign in to Account
                </button>
            </div>
        </form>
        
        <!-- Signup Form (initially hidden) -->
        <form id="signupForm" class="space-y-5 hidden">
            <div>
                <label for="signupName" class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                <input type="text" id="signupName" name="name" required 
                    class="block w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-700/80 text-white">
            </div>
            
            <div>
                <label for="signupEmail" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                <input type="email" id="signupEmail" name="email" required 
                    class="block w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-700/80 text-white">
            </div>
            
            <div>
                <label for="signupPassword" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="signupPassword" name="password" required 
                    class="block w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-700/80 text-white">
            </div>
            
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required 
                    class="block w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-700/80 text-white">
            </div>
            
            <div class="pt-2">
                <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all glow-effect">
                    Create Account
                </button>
            </div>
        </form>
        
        <div class="mt-8 text-center text-sm text-gray-400">
            &copy; 2025 Your Company. All rights reserved.
        </div>
    </div>

    <script>
        // Tab switching functionality
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const alertBox = document.getElementById('alertBox');
        
        loginTab.addEventListener('click', function() {
            loginTab.classList.add('text-blue-400', 'border-b-2', 'border-blue-500');
            loginTab.classList.remove('text-gray-400');
            signupTab.classList.remove('text-blue-400', 'border-b-2', 'border-blue-500');
            signupTab.classList.add('text-gray-400');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            alertBox.classList.add('hidden');
        });
        
        signupTab.addEventListener('click', function() {
            signupTab.classList.add('text-blue-400', 'border-b-2', 'border-blue-500');
            signupTab.classList.remove('text-gray-400');
            loginTab.classList.remove('text-blue-400', 'border-b-2', 'border-blue-500');
            loginTab.classList.add('text-gray-400');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            alertBox.classList.add('hidden');
        });
        
        // Login form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch('/auth/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token and user data in localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.admin.name);
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('accessLevel', data.admin.accessLevel || 'basic');
                    
                    // Show success message
                    alertBox.className = 'mb-6 p-4 rounded-lg bg-emerald-900/70 text-emerald-100 border border-emerald-700';
                    alertBox.textContent = 'Login successful! Redirecting...';
                    alertBox.classList.remove('hidden');
                    
                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 1500);
                } else {
                    // Show error message
                    alertBox.className = 'mb-6 p-4 rounded-lg bg-red-900/70 text-red-100 border border-red-800';
                    alertBox.textContent = data.message || 'Login failed. Please check your credentials.';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.className = 'mb-6 p-4 rounded-lg bg-red-900/70 text-red-100 border border-red-800';
                alertBox.textContent = 'An error occurred. Please try again later.';
                alertBox.classList.remove('hidden');
            }
        });
        
        // Signup form submission
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Simple validation
            if (password !== confirmPassword) {
                alertBox.className = 'mb-6 p-4 rounded-lg bg-red-900/70 text-red-100 border border-red-800';
                alertBox.textContent = 'Passwords do not match';
                alertBox.classList.remove('hidden');
                return;
            }
            
            try {
                const response = await fetch('/auth/admin/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name, 
                        email, 
                        password,
                        isAdmin: true,
                        accessLevel: 'basic' // Default access level for new admins
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show success message
                    alertBox.className = 'mb-6 p-4 rounded-lg bg-emerald-900/70 text-emerald-100 border border-emerald-700';
                    alertBox.textContent = 'Account created successfully! You can now login.';
                    alertBox.classList.remove('hidden');
                    
                    // Clear form
                    signupForm.reset();
                    
                    // Switch to login tab
                    setTimeout(() => {
                        loginTab.click();
                    }, 2000);
                } else {
                    // Show error message
                    alertBox.className = 'mb-6 p-4 rounded-lg bg-red-900/70 text-red-100 border border-red-800';
                    alertBox.textContent = data.message || 'Signup failed. Please try again.';
                    alertBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.className = 'mb-6 p-4 rounded-lg bg-red-900/70 text-red-100 border border-red-800';
                alertBox.textContent = 'An error occurred. Please try again later.';
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
